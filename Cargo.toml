[package]
name = "xmrtui"
version = "0.1.0"
edition = "2024"
description = "A vim-like TUI for the official Monero wallet RPC"
license = "MIT"
rust-version = "1.93"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
hex = "0.4"
monero = "0.22"
monero-rpc = "0.5.1"
ratatui = "0.29"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "net"] }
